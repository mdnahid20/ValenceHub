<section class="auth-page">
  <p class="auth-page__eyebrow">Auth</p>
  <h2>Forgot password</h2>
  <p>Enter the email or phone tied to your account to receive a password reset OTP.</p>

  <form class="auth-page__form" [formGroup]="forgotPasswordForm" (ngSubmit)="submit()">
    <label class="auth-page__field">
      <span>Email or phone</span>
      <input type="text" formControlName="target" autocomplete="email" />
    </label>

    @if (errorMessage) {
      <p class="auth-page__message auth-page__message--error">{{ errorMessage }}</p>
    }

    <button class="auth-page__button" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Sending code...' : 'Send OTP' }}
    </button>
  </form>

  <div class="auth-page__actions">
    <a routerLink="/auth/verify-otp">Verify OTP</a>
    <a routerLink="/auth/login">Back to login</a>
  </div>
</section>
