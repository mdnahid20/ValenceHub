<section class="auth-page">
  <p class="auth-page__eyebrow">Auth</p>
  <h2>Create your account</h2>
  <p>Use email or phone with a password, then verify OTP to complete registration.</p>

  <form class="auth-page__form" [formGroup]="registerForm" (ngSubmit)="submit()">
    <label class="auth-page__field">
      <span>Email (optional)</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label class="auth-page__field">
      <span>Phone number (optional)</span>
      <input type="tel" formControlName="phoneNumber" autocomplete="tel" />
    </label>

    <label class="auth-page__field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>

    @if (registerForm.errors?.['requireEmailOrPhone']) {
      <p class="auth-page__message auth-page__message--error">
        Provide either an email or phone number.
      </p>
    }

    @if (errorMessage) {
      <p class="auth-page__message auth-page__message--error">{{ errorMessage }}</p>
    }

    <button class="auth-page__button" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Creating account...' : 'Create account' }}
    </button>
  </form>

  <div class="auth-page__actions">
    <a routerLink="/auth/login">Already have an account?</a>
    <a routerLink="/auth/verify-otp">Go to OTP verification</a>
  </div>
</section>
