<section class="auth-page">
  <p class="auth-page__eyebrow">Auth</p>
  <h2>Reset password</h2>
  <p>Set a new password to finish the password recovery flow.</p>

  <form class="auth-page__form" [formGroup]="resetPasswordForm" (ngSubmit)="submit()">
    <label class="auth-page__field">
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
    </label>

    <label class="auth-page__field">
      <span>Confirm password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>

    @if (resetPasswordForm.errors?.['passwordsMismatch']) {
      <p class="auth-page__message auth-page__message--error">Passwords do not match.</p>
    }

    @if (successMessage) {
      <p class="auth-page__message auth-page__message--info">{{ successMessage }}</p>
    }

    @if (errorMessage) {
      <p class="auth-page__message auth-page__message--error">{{ errorMessage }}</p>
    }

    <button class="auth-page__button" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Resetting password...' : 'Reset password' }}
    </button>
  </form>

  <div class="auth-page__actions">
    <a routerLink="/auth/verify-otp">Back to OTP verification</a>
    <a routerLink="/auth/login">Return to login</a>
  </div>
</section>
