<main class="home-page">
  <section class="home-page__hero">
    <p class="home-page__eyebrow">ValenceHub</p>
    <h1>Authentication is wired to the live API contracts.</h1>
    <p>
      Register, login, OTP verification, and password reset now submit contract-aligned payloads to
      backend auth endpoints.
    </p>

    <div class="home-page__actions">
      @if (!isAuthenticated) {
        <a class="home-page__button home-page__button--primary" routerLink="/auth/register">
          Register
        </a>
        <a class="home-page__button" routerLink="/auth/login">Login</a>
      } @else {
        <button
          class="home-page__button home-page__button--primary"
          type="button"
          (click)="logout()"
          [disabled]="isSubmitting"
        >
          {{ isSubmitting ? 'Signing out...' : 'Logout' }}
        </button>
      }
    </div>
  </section>
</main>
